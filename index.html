<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edzyl 的旅遊手冊</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A27;
    --paper:#FBF6EC;
    --card:#FFFDF8;
    --line:#D9CDB2;
    --muted:#6B7A76;
    --teal:#12564F;
    --teal-deep:#0B3B37;
    --coral:#E9714A;
    --gold:#D6A24C;
    --red:#d6262c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(11,59,55,0.06) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:72px 24px 80px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:14px;
  }
  h1{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:clamp(28px,6vw,40px);
    margin:0 0 8px;
    color:var(--teal-deep);
  }
  .lead{color:var(--muted);font-size:14.5px;margin:0 0 40px;}
  .trip{
    display:flex;
    align-items:center;
    gap:18px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 24px;
    margin-bottom:16px;
    text-decoration:none;
    color:inherit;
    box-shadow:0 10px 28px -20px rgba(11,59,55,.45);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .trip:hover{
    transform:translateY(-2px);
    box-shadow:0 16px 34px -20px rgba(11,59,55,.55);
  }
  .trip .flag{
    font-size:30px;
    width:56px;height:56px;
    display:flex;align-items:center;justify-content:center;
    border-radius:12px;
    background:var(--paper);
    border:1px solid var(--line);
    flex-shrink:0;
  }
  .trip .info{flex:1;min-width:0;}
  .trip .date{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    color:var(--coral);
    margin-bottom:4px;
  }
  .trip.tokyo .date{color:var(--red);}
  .trip .name{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:19px;
    color:var(--teal-deep);
  }
  .trip .desc{font-size:13px;color:var(--muted);margin-top:3px;}
  .trip .go{
    font-family:'IBM Plex Mono',monospace;
    color:var(--gold);
    font-size:18px;
    flex-shrink:0;
  }
  footer{
    margin-top:56px;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    color:var(--muted);
    text-transform:uppercase;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Travel Guides · Index</div>
    <h1>Edzyl 的旅遊手冊</h1>
    <p class="lead">點選一趟旅程，開啟完整行程手冊</p>

    <a class="trip" href="./202609bangkok.html">
      <div class="flag">🇹🇭</div>
      <div class="info">
        <div class="date">2026.09.02 – 09.10</div>
        <div class="name">曼谷・芭達雅・小珊瑚島</div>
        <div class="desc">9 天 8 夜 · 星宇直飛 · 租車自駕 + 跳島</div>
      </div>
      <div class="go">→</div>
    </a>

    <a class="trip tokyo" href="./202605tokyo.html">
      <div class="flag">🇯🇵</div>
      <div class="info">
        <div class="date">2026.05.21 – 05.29</div>
        <div class="name">第 14 次東京之旅</div>
        <div class="desc">Tokyo 9 Days · 河口湖 · 展覽巡禮</div>
      </div>
      <div class="go">→</div>
    </a>

    <footer>edzylgu.github.io/trip</footer>
  </div>
</body>
</html>
